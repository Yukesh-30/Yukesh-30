name: Refresh Contribution Heatmap

on:
  schedule:
    # Run daily at midnight UTC
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-heatmap:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/python-1x@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests==2.32.3 beautifulsoup4==4.12.3

      - name: Fetch Contributions
        env:
          GITHUB_USERNAME: ${{ github.repository_owner }}
        run: |
          python scripts/fetch_contributions.py

      - name: Render Heatmap & Terminal Suite SVGs
        run: |
          python scripts/render_heatmap_svg.py
          python scripts/render_whoami_suite.py

      - name: Commit and Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add contrib-heatmap.svg whoami-suite.svg data/contributions.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore: auto-update contribution heatmap & terminal suite [skip ci]" && git push)
